<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Task Master</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-item>
    <ion-label position="stacked">Nueva tarea</ion-label>

    <ion-input
      [(ngModel)]="newTaskStr"
      placeholder="Ejemplo: estudiar">
    </ion-input>
  </ion-item>

  <ion-button
    expand="block"
    color="primary"
    (click)="addTask()">
    Agregar tarea
  </ion-button>

  <ion-list>

    @for (tarea of tasks; track tarea.id) {

      <ion-item>
        <ion-label>
          {{ tarea.titulo }}
        </ion-label>
      </ion-item>

    }

  </ion-list>

</ion-content>
